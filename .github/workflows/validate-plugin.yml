name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    # Development tooling lives in dev/ so the plugin root carries no
    # package.json or lockfile (backlog H-8). The plugin itself needs no install.
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dev/package-lock.json

      - name: Validate manifest and frontmatter
        run: node scripts/validate-plugin.mjs ..

      - name: Install development dependencies (reproducible)
        run: npm ci

      - name: Verify committed MCP bundle is current
        run: npm run check:mcp-bundle

      - name: Verify install-free host packaging
        run: npm run test:packaging

      - name: Validate Claude plugin manifest
        run: npx --yes @anthropic-ai/claude-code plugin validate .. --strict

      - name: Credential redaction tests
        run: node tests/redact.test.mjs

      - name: Host platform identity tests
        run: node tests/host-platform.test.mjs

      - name: Tool annotation contract
        run: node tests/mcp-tools.test.mjs

      - name: MCP stdio protocol edges
        run: node tests/mcp-stdio.test.mjs
